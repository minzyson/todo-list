<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas: #f5f5f7;
      --surface: #fff;
      --ink: #1d1d1f;
      --muted: #7a7a7a;
      --hairline: #e0e0e0;
      --nav-bg: #000;
      --nav-ink: #fff;
    }
    body.dark {
      --canvas: #1d1d1f;
      --surface: #2a2a2c;
      --ink: #f5f5f7;
      --muted: #cccccc;
      --hairline: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }

    nav {
      width: 100%; background: var(--nav-bg); height: 44px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    nav .brand { color: var(--nav-ink); font-size: 17px; font-weight: 600; letter-spacing: -0.374px; }
    .theme-toggle {
      background: #1d1d1f; color: #fff; border: none; border-radius: 8px;
      height: 28px; padding: 0 12px; font-size: 14px; font-family: inherit;
      cursor: pointer; transition: transform 0.1s;
    }
    .theme-toggle:active { transform: scale(0.95); }

    .hero {
      width: 100%; background: var(--surface); padding: 64px 24px 48px;
      text-align: center; transition: background 0.3s;
    }
    .today-date { font-size: 14px; font-weight: 600; letter-spacing: -0.224px; color: #0066cc; margin-bottom: 8px; }
    .hero h1 { font-size: 40px; font-weight: 600; line-height: 1.10; letter-spacing: -0.374px; margin-bottom: 12px; }
    .hero p { font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; color: var(--muted); margin-bottom: 28px; }

    .input-row {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      max-width: 820px; margin: 0 auto;
    }
    .input-row input[type="text"] {
      flex: 1 1 200px; height: 44px; border: 1px solid rgba(0,0,0,0.08);
      border-radius: 9999px; padding: 12px 20px; font-size: 17px; font-family: inherit;
      color: var(--ink); background: var(--surface); outline: none; transition: box-shadow 0.15s;
    }
    .input-row input:focus { box-shadow: 0 0 0 2px #0071e3; }
    .sel, .input-row input[type="date"] {
      height: 44px; border: 1px solid rgba(0,0,0,0.08); border-radius: 9999px;
      padding: 0 18px; font-size: 15px; font-family: inherit;
      color: var(--ink); background: var(--surface); outline: none; cursor: pointer;
    }
    .btn-primary {
      height: 44px; padding: 11px 22px; background: #0066cc; color: #fff;
      font-size: 17px; font-family: inherit; border: none; border-radius: 9999px;
      cursor: pointer; transition: transform 0.1s; white-space: nowrap;
    }
    .btn-primary:active { transform: scale(0.95); }

    /* ── Overall dashboard ── */
    .dashboard {
      width: 100%; max-width: 760px; padding: 28px 24px 0;
    }
    .stat-cards { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat-card {
      flex: 1; background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 18px; padding: 16px; text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 600; letter-spacing: -0.374px; }
    .stat-num.blue { color: #0066cc; }
    .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; letter-spacing: -0.224px; }
    .progress-wrap {
      width: 100%; height: 8px; background: var(--hairline);
      border-radius: 9999px; overflow: hidden; margin-bottom: 6px;
    }
    .progress-bar { height: 100%; background: #0066cc; border-radius: 9999px; transition: width 0.4s ease; width: 0%; }
    .progress-text { font-size: 13px; color: var(--muted); text-align: right; letter-spacing: -0.224px; }

    /* ── View toggle ── */
    .view-toggle {
      width: 100%; background: var(--canvas); border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 16px; position: sticky; top: 0; z-index: 10; margin-top: 24px;
      transition: background 0.3s;
    }
    .toggle-btn {
      height: 36px; padding: 8px 20px; background: transparent; color: #0066cc;
      font-size: 15px; font-family: inherit; letter-spacing: -0.224px;
      border: 1px solid #0066cc; border-radius: 9999px; cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .toggle-btn.active { background: #0066cc; color: #fff; }
    .toggle-btn:active { transform: scale(0.95); }

    .list-section { width: 100%; max-width: 760px; padding: 24px 24px 80px; }

    /* ── Group block ── */
    .group {
      margin-bottom: 28px; background: var(--surface);
      border: 1px solid var(--hairline); border-radius: 18px; overflow: hidden;
    }
    .group-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--hairline);
    }
    .group-title { font-size: 18px; font-weight: 600; letter-spacing: -0.374px; display: flex; align-items: center; gap: 10px; }
    .group-count {
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: var(--canvas); padding: 3px 12px; border-radius: 9999px;
    }
    .group-mini-bar { width: 100px; height: 6px; background: var(--hairline); border-radius: 9999px; overflow: hidden; }
    .group-mini-fill { height: 100%; background: #0066cc; border-radius: 9999px; transition: width 0.4s; }
    .group-body { padding: 8px 12px 12px; }
    .group-empty { padding: 18px 20px; color: var(--muted); font-size: 15px; }

    /* ── Card ── */
    .todo-card {
      background: var(--surface); border-bottom: 1px solid var(--hairline);
      padding: 14px 8px; display: flex; align-items: flex-start; gap: 14px;
      transition: opacity 0.2s;
    }
    .todo-card:last-child { border-bottom: none; }
    .todo-card.done { opacity: 0.5; }

    .check-wrap { flex-shrink: 0; margin-top: 2px; }
    .check-wrap input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 22px; height: 22px;
      border-radius: 9999px; border: 2px solid var(--hairline); cursor: pointer;
      position: relative; transition: background 0.15s, border-color 0.15s;
    }
    .check-wrap input[type="checkbox"]:checked { background: #0066cc; border-color: #0066cc; }
    .check-wrap input[type="checkbox"]:checked::after {
      content: ""; position: absolute; left: 5px; top: 2px; width: 6px; height: 11px;
      border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg);
    }

    .todo-body { flex: 1; min-width: 0; }
    .todo-text { font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; word-break: break-word; cursor: text; }
    .todo-card.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .badge { font-size: 12px; font-weight: 600; letter-spacing: -0.12px; padding: 2px 10px; border-radius: 9999px; }
    .badge.high { background: #ffe5e5; color: #cc0000; }
    .badge.medium { background: #fff0d9; color: #b35900; }
    .badge.low { background: #e5f0ff; color: #0066cc; }
    body.dark .badge.high { background: #4a1f1f; color: #ff8080; }
    body.dark .badge.medium { background: #4a3a1f; color: #ffc47a; }
    body.dark .badge.low { background: #1f3a4a; color: #80b3ff; }
    .badge.cat { background: #e8e8ed; color: #1d1d1f; }
    body.dark .badge.cat { background: #3a3a3c; color: #f5f5f7; }
    .badge.dday { background: #eef0f2; color: #1d1d1f; }
    .badge.dday.soon { background: #ffe5e5; color: #cc0000; }
    .badge.dday.over { background: #ddd; color: #555; }
    body.dark .badge.dday { background: #3a3a3c; color: #f5f5f7; }
    body.dark .badge.dday.over { background: #333; color: #999; }

    .gcal-link {
      font-size: 12px; color: #0066cc; text-decoration: none; font-weight: 600;
      letter-spacing: -0.12px; display: inline-flex; align-items: center; gap: 3px;
    }
    .gcal-link:hover { text-decoration: underline; }

    .edit-input {
      width: 100%; font-size: 17px; font-family: inherit; color: var(--ink);
      background: var(--canvas); border: 1px solid #0071e3; border-radius: 8px;
      padding: 6px 10px; outline: none;
    }
    .btn-delete {
      flex-shrink: 0; width: 30px; height: 30px; background: rgba(210,210,215,0.64);
      border: none; border-radius: 9999px; cursor: pointer; font-size: 16px; color: #1d1d1f;
      display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
    }
    .btn-delete:active { transform: scale(0.95); }

    .empty-state { text-align: center; padding: 64px 0; color: var(--muted); font-size: 17px; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0066cc; color: #fff; padding: 14px 28px; border-radius: 9999px;
      font-size: 17px; letter-spacing: -0.374px; box-shadow: rgba(0,0,0,0.22) 3px 5px 30px 0;
      opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer {
      width: 100%; background: var(--canvas); border-top: 1px solid var(--hairline);
      padding: 32px 24px; text-align: center; color: var(--muted); font-size: 12px;
      letter-spacing: -0.12px; transition: background 0.3s;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 28px; }
      .hero { padding: 48px 20px; }
      .list-section, .dashboard { padding-left: 16px; padding-right: 16px; }
      .stat-cards { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="brand">To Do</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크</button>
  </nav>

  <section class="hero">
    <div class="today-date" id="todayDate"></div>
    <h1>민지님의 오늘의 할일</h1>
    <div class="input-row">
      <input id="todoInput" type="text" placeholder="새로운 할 일 입력…" />
      <select id="categorySelect" class="sel">
        <option value="대학정보공시">대학정보공시</option>
        <option value="법인감사">법인감사</option>
        <option value="고등교육통계">고등교육통계</option>
        <option value="공익제보">공익제보</option>
        <option value="국민신문고">국민신문고</option>
        <option value="정보공개청구">정보공개청구</option>
      </select>
      <select id="prioritySelect" class="sel">
        <option value="low">낮음</option>
        <option value="medium" selected>보통</option>
        <option value="high">높음</option>
      </select>
      <input id="dueInput" type="date" title="마감기한" />
      <button class="btn-primary" onclick="addTodo()">추가</button>
    </div>
  </section>

  <div class="dashboard">
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">전체</div></div>
      <div class="stat-card"><div class="stat-num blue" id="statDone">0</div><div class="stat-label">완료</div></div>
      <div class="stat-card"><div class="stat-num" id="statLeft">0</div><div class="stat-label">남음</div></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0% 완료</div>
  </div>

  <div class="view-toggle">
    <button class="toggle-btn active" id="btnCat" onclick="setView('category')">📁 업무 종류별</button>
    <button class="toggle-btn" id="btnStatus" onclick="setView('status')">✅ 완료 상태별</button>
  </div>

  <div class="list-section">
    <div id="todoGroups"></div>
  </div>

  <footer>손민지의 To Do List · 더블클릭 수정 · 마감일 있으면 Google 캘린더 추가 가능</footer>

  <div class="toast" id="toast"></div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let view = localStorage.getItem('view') || 'category';

    const CATEGORIES = ['대학정보공시','법인감사','고등교육통계','공익제보','국민신문고','정보공개청구'];
    const PRIO_LABEL = { high: '높음', medium: '보통', low: '낮음' };
    const CHEERS = [
      '잘하고 있어요! 👏','하나 끝! 멋져요 ✨','훌륭해요, 계속 가봐요! 🚀',
      '완료! 한 걸음 더 가까워졌어요 🎯','대단해요! 이 기세로 쭉 💪',
      '깔끔하게 처리했네요 😎','오늘도 해냈어요! 🌟','한 건 클리어! 자랑스러워요 🥳'
    ];

    function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({
        id: Date.now(), text, done: false,
        category: document.getElementById('categorySelect').value,
        priority: document.getElementById('prioritySelect').value,
        due: document.getElementById('dueInput').value || '',
        created: new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })
      });
      input.value = '';
      document.getElementById('dueInput').value = '';
      saveTodos(); render();
    }

    function toggleTodo(id) {
      const t = todos.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      saveTodos(); render();
      if (t.done) showCheer();
    }

    function showCheer() {
      const toast = document.getElementById('toast');
      toast.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
      toast.classList.add('show');
      clearTimeout(showCheer._t);
      showCheer._t = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function deleteTodo(id) { todos = todos.filter(t => t.id !== id); saveTodos(); render(); }

    function startEdit(id) {
      const t = todos.find(x => x.id === id);
      if (!t || t.done) return;
      t._editing = true; render();
      const el = document.querySelector(`[data-edit="${id}"]`);
      if (el) { el.focus(); el.select(); }
    }
    function commitEdit(id, value) {
      const t = todos.find(x => x.id === id);
      if (!t) return;
      const v = value.trim(); if (v) t.text = v;
      delete t._editing; saveTodos(); render();
    }

    function setView(v) {
      view = v; localStorage.setItem('view', v);
      document.getElementById('btnCat').classList.toggle('active', v === 'category');
      document.getElementById('btnStatus').classList.toggle('active', v === 'status');
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').textContent = dark ? '☀️ 라이트' : '🌙 다크';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    /* ── Deadline helpers ── */
    function ddayInfo(due) {
      if (!due) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(due + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      let label, cls = '';
      if (diff > 1) label = `D-${diff}`;
      else if (diff === 1) { label = 'D-1'; cls = 'soon'; }
      else if (diff === 0) { label = 'D-DAY'; cls = 'soon'; }
      else { label = `D+${-diff}`; cls = 'over'; }
      return { label, cls, text: `${d.getMonth()+1}/${d.getDate()} 마감` };
    }

    function gcalUrl(t) {
      const ymd = t.due.replace(/-/g, '');
      const next = new Date(t.due + 'T00:00:00'); next.setDate(next.getDate()+1);
      const endYmd = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,'0')}${String(next.getDate()).padStart(2,'0')}`;
      const text = encodeURIComponent(`[${t.category}] ${t.text}`);
      const details = encodeURIComponent(`우선순위: ${PRIO_LABEL[t.priority]} · To Do List`);
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${ymd}/${endYmd}&details=${details}`;
    }

    /* ── Card HTML ── */
    function cardHtml(t) {
      if (t._editing) {
        return `<div class="todo-card">
          <div class="check-wrap"><input type="checkbox" disabled /></div>
          <div class="todo-body">
            <input class="edit-input" data-edit="${t.id}" value="${escapeHtml(t.text)}"
              onblur="commitEdit(${t.id}, this.value)"
              onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escapeHtml(t.text)}';this.blur();}" />
          </div></div>`;
      }
      const dd = ddayInfo(t.due);
      const ddBadge = dd ? `<span class="badge dday ${dd.cls}" title="${dd.text}">📅 ${dd.label}</span>` : '';
      const gcal = (t.due && !t.done) ? `<a class="gcal-link" href="${gcalUrl(t)}" target="_blank" rel="noopener">📆 캘린더 추가</a>` : '';
      return `<div class="todo-card ${t.done ? 'done' : ''}">
        <div class="check-wrap"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})" /></div>
        <div class="todo-body">
          <div class="todo-text" ondblclick="startEdit(${t.id})">${escapeHtml(t.text)}</div>
          <div class="todo-meta">
            <span class="badge cat">${escapeHtml(t.category || '')}</span>
            <span class="badge ${t.priority}">${PRIO_LABEL[t.priority]}</span>
            ${ddBadge}${gcal}
          </div>
        </div>
        <button class="btn-delete" onclick="deleteTodo(${t.id})" title="삭제">✕</button>
      </div>`;
    }

    function groupBlock(title, items, icon) {
      const total = items.length;
      const done = items.filter(t => t.done).length;
      const pct = total ? Math.round(done/total*100) : 0;
      const body = total
        ? items.map(cardHtml).join('')
        : '<div class="group-empty">항목이 없습니다.</div>';
      return `<div class="group">
        <div class="group-head">
          <span class="group-title">${icon || ''} ${escapeHtml(title)}</span>
          <span style="display:flex;align-items:center;gap:10px;">
            <span class="group-mini-bar"><span class="group-mini-fill" style="width:${pct}%"></span></span>
            <span class="group-count">${done}/${total}</span>
          </span>
        </div>
        <div class="group-body">${body}</div>
      </div>`;
    }

    function render() {
      // dashboard
      const total = todos.length;
      const doneCount = todos.filter(t => t.done).length;
      const pct = total ? Math.round(doneCount/total*100) : 0;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDone').textContent = doneCount;
      document.getElementById('statLeft').textContent = total - doneCount;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${pct}% 완료 · 남은 일 ${total - doneCount}개`;

      const container = document.getElementById('todoGroups');
      if (total === 0) {
        container.innerHTML = '<div class="empty-state">할 일이 없습니다. 위에서 추가해 보세요!</div>';
        return;
      }

      const sortFn = (a,b) => (a.done - b.done) || (dueSort(a) - dueSort(b));
      let html = '';
      if (view === 'category') {
        const used = CATEGORIES.filter(c => todos.some(t => t.category === c));
        html = used.map(c =>
          groupBlock(c, todos.filter(t => t.category === c).slice().sort(sortFn), '📁')
        ).join('');
      } else {
        const active = todos.filter(t => !t.done).slice().sort((a,b)=>dueSort(a)-dueSort(b));
        const done = todos.filter(t => t.done);
        html = groupBlock('미완료', active, '⏳') + groupBlock('완료', done, '✅');
      }
      container.innerHTML = html;
    }

    function dueSort(t) { return t.due ? new Date(t.due).getTime() : Infinity; }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('todoInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    document.getElementById('todayDate').textContent =
      new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    if (localStorage.getItem('theme') === 'dark') toggleTheme();
    setView(view);
  </script>
</body>
</html>
