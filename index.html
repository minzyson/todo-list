<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --canvas: #f5f5f7;
      --surface: #fff;
      --ink: #1d1d1f;
      --muted: #7a7a7a;
      --hairline: #e0e0e0;
      --nav-bg: #000;
      --nav-ink: #fff;
    }
    body.dark {
      --canvas: #1d1d1f;
      --surface: #2a2a2c;
      --ink: #f5f5f7;
      --muted: #cccccc;
      --hairline: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Global Nav ── */
    nav {
      width: 100%;
      background: var(--nav-bg);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    nav .brand {
      color: var(--nav-ink);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.374px;
    }
    .theme-toggle {
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 8px;
      height: 28px;
      padding: 0 12px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .theme-toggle:active { transform: scale(0.95); }

    /* ── Hero ── */
    .hero {
      width: 100%;
      background: var(--surface);
      padding: 72px 24px 56px;
      text-align: center;
      transition: background 0.3s;
    }
    .today-date {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.224px;
      color: #0066cc;
      margin-bottom: 8px;
    }
    .hero h1 {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.10;
      letter-spacing: -0.374px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.374px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 760px;
      margin: 0 auto;
    }
    .input-row input[type="text"] {
      flex: 1 1 220px;
      height: 44px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 9999px;
      padding: 12px 20px;
      font-size: 17px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: box-shadow 0.15s;
    }
    .input-row input:focus { box-shadow: 0 0 0 2px #0071e3; }
    .sel {
      height: 44px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 9999px;
      padding: 0 18px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      cursor: pointer;
    }
    .btn-primary {
      height: 44px;
      padding: 11px 22px;
      background: #0066cc;
      color: #fff;
      font-size: 17px;
      font-family: inherit;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    .btn-primary:active { transform: scale(0.95); }

    /* ── Filters ── */
    .filters {
      width: 100%;
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.3s;
    }
    .filter-btn {
      height: 32px;
      padding: 8px 16px;
      background: transparent;
      color: #0066cc;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: -0.224px;
      border: 1px solid #0066cc;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .filter-btn.active { background: #0066cc; color: #fff; }
    .filter-btn:active { transform: scale(0.95); }

    /* ── List ── */
    .list-section {
      width: 100%;
      max-width: 720px;
      padding: 28px 24px 80px;
    }
    .list-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: -0.224px;
    }
    .clear-link {
      background: none; border: none;
      color: #0066cc; font-size: 14px; font-family: inherit;
      cursor: pointer; padding: 4px;
    }
    .empty-state {
      text-align: center; padding: 64px 0;
      color: var(--muted); font-size: 17px;
    }
    .drag-hint {
      font-size: 12px; color: var(--muted);
      text-align: center; margin-bottom: 12px; letter-spacing: -0.12px;
    }

    /* ── Card ── */
    .todo-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: opacity 0.2s, background 0.3s, box-shadow 0.15s, transform 0.15s;
    }
    .todo-card.done { opacity: 0.5; }
    .todo-card.dragging { opacity: 0.4; box-shadow: rgba(0,0,0,0.22) 3px 5px 30px 0; }
    .todo-card.drag-over { transform: translateY(4px); border-color: #0066cc; }

    .drag-handle {
      flex-shrink: 0; cursor: grab; user-select: none;
      color: var(--muted); font-size: 18px; line-height: 1.2;
      padding-top: 1px;
    }
    .drag-handle:active { cursor: grabbing; }

    .check-wrap { flex-shrink: 0; margin-top: 2px; }
    .check-wrap input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 9999px;
      border: 2px solid var(--hairline);
      cursor: pointer; position: relative;
      transition: background 0.15s, border-color 0.15s;
    }
    .check-wrap input[type="checkbox"]:checked { background: #0066cc; border-color: #0066cc; }
    .check-wrap input[type="checkbox"]:checked::after {
      content: ""; position: absolute; left: 5px; top: 2px;
      width: 6px; height: 11px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg);
    }

    .todo-body { flex: 1; min-width: 0; }
    .todo-text {
      font-size: 17px; line-height: 1.47; letter-spacing: -0.374px;
      word-break: break-word; cursor: text;
    }
    .todo-card.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-meta {
      display: flex; align-items: center; gap: 8px;
      margin-top: 6px; flex-wrap: wrap;
    }
    .badge {
      font-size: 12px; font-weight: 600; letter-spacing: -0.12px;
      padding: 2px 10px; border-radius: 9999px;
    }
    .badge.high { background: #ffe5e5; color: #cc0000; }
    .badge.medium { background: #fff0d9; color: #b35900; }
    .badge.low { background: #e5f0ff; color: #0066cc; }
    body.dark .badge.high { background: #4a1f1f; color: #ff8080; }
    body.dark .badge.medium { background: #4a3a1f; color: #ffc47a; }
    body.dark .badge.low { background: #1f3a4a; color: #80b3ff; }
    .badge.cat { background: #e8e8ed; color: #1d1d1f; }
    body.dark .badge.cat { background: #3a3a3c; color: #f5f5f7; }
    .todo-date { font-size: 12px; color: var(--muted); letter-spacing: -0.12px; }

    .edit-input {
      width: 100%; font-size: 17px; font-family: inherit;
      color: var(--ink); background: var(--canvas);
      border: 1px solid #0071e3; border-radius: 8px;
      padding: 6px 10px; outline: none;
    }
    .btn-delete {
      flex-shrink: 0; width: 30px; height: 30px;
      background: rgba(210,210,215,0.64); border: none;
      border-radius: 9999px; cursor: pointer;
      font-size: 16px; color: #1d1d1f;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .btn-delete:active { transform: scale(0.95); }

    .progress-wrap {
      width: 100%; height: 6px; background: var(--hairline);
      border-radius: 9999px; overflow: hidden; margin-bottom: 20px;
    }
    .progress-bar {
      height: 100%; background: #0066cc; border-radius: 9999px;
      transition: width 0.4s ease; width: 0%;
    }

    /* ── Encouragement toast ── */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0066cc; color: #fff;
      padding: 14px 28px; border-radius: 9999px;
      font-size: 17px; letter-spacing: -0.374px;
      box-shadow: rgba(0,0,0,0.22) 3px 5px 30px 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    footer {
      width: 100%; background: var(--canvas);
      border-top: 1px solid var(--hairline);
      padding: 32px 24px; text-align: center;
      color: var(--muted); font-size: 12px; letter-spacing: -0.12px;
      transition: background 0.3s;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 28px; }
      .hero { padding: 48px 20px; }
      .list-section { padding: 24px 16px 64px; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="brand">To Do</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크</button>
  </nav>

  <section class="hero">
    <div class="today-date" id="todayDate"></div>
    <h1>오늘 할 일</h1>
    <p>카테고리를 정하고 끌어서 순서를 바꿔보세요.</p>
    <div class="input-row">
      <input id="todoInput" type="text" placeholder="새로운 할 일 입력…" />
      <select id="categorySelect" class="sel">
        <option value="대학정보공시">대학정보공시</option>
        <option value="법인감사">법인감사</option>
        <option value="고등교육통계">고등교육통계</option>
        <option value="공익제보">공익제보</option>
        <option value="국민신문고">국민신문고</option>
        <option value="정보공개청구">정보공개청구</option>
      </select>
      <select id="prioritySelect" class="sel">
        <option value="low">낮음</option>
        <option value="medium" selected>보통</option>
        <option value="high">높음</option>
      </select>
      <button class="btn-primary" onclick="addTodo()">추가</button>
    </div>
  </section>

  <div class="filters" id="filterBar"></div>

  <div class="list-section">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="list-stats">
      <span id="statsText">할 일 0개</span>
      <button class="clear-link" onclick="clearDone()">완료 항목 비우기</button>
    </div>
    <div class="drag-hint">⠿ 손잡이를 끌어 순서를 바꿀 수 있어요</div>
    <div id="todoList"></div>
  </div>

  <footer>손민지의 To Do List · 더블클릭 수정 · 드래그 정렬</footer>

  <div class="toast" id="toast"></div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let filter = 'all';
    let dragId = null;

    const CATEGORIES = ['대학정보공시','법인감사','고등교육통계','공익제보','국민신문고','정보공개청구'];
    const PRIO_LABEL = { high: '높음', medium: '보통', low: '낮음' };
    const CHEERS = [
      '잘하고 있어요! 👏',
      '하나 끝! 멋져요 ✨',
      '훌륭해요, 계속 가봐요! 🚀',
      '완료! 한 걸음 더 가까워졌어요 🎯',
      '대단해요! 이 기세로 쭉 💪',
      '깔끔하게 처리했네요 😎',
      '오늘도 해냈어요! 🌟',
      '한 건 클리어! 자랑스러워요 🥳'
    ];

    function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }

    function buildFilters() {
      const base = [
        { key: 'all', label: '전체' },
        { key: 'active', label: '미완료' },
        { key: 'done', label: '완료' }
      ];
      const cats = CATEGORIES.map(c => ({ key: 'cat:' + c, label: c }));
      const bar = document.getElementById('filterBar');
      bar.innerHTML = base.concat(cats).map(f =>
        `<button class="filter-btn ${filter === f.key ? 'active' : ''}"
          onclick="setFilter('${f.key}')">${f.label}</button>`
      ).join('');
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({
        id: Date.now(), text, done: false,
        category: document.getElementById('categorySelect').value,
        priority: document.getElementById('prioritySelect').value,
        created: new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })
      });
      input.value = '';
      saveTodos(); render();
    }

    function toggleTodo(id) {
      const t = todos.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      saveTodos(); render();
      if (t.done) showCheer();
    }

    function showCheer() {
      const toast = document.getElementById('toast');
      toast.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
      toast.classList.add('show');
      clearTimeout(showCheer._t);
      showCheer._t = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos(); render();
    }

    function clearDone() {
      if (!todos.some(t => t.done)) return;
      todos = todos.filter(t => !t.done);
      saveTodos(); render();
    }

    function startEdit(id) {
      const t = todos.find(x => x.id === id);
      if (!t || t.done) return;
      t._editing = true;
      render();
      const el = document.querySelector(`[data-edit="${id}"]`);
      if (el) { el.focus(); el.select(); }
    }

    function commitEdit(id, value) {
      const t = todos.find(x => x.id === id);
      if (!t) return;
      const v = value.trim();
      if (v) t.text = v;
      delete t._editing;
      saveTodos(); render();
    }

    function setFilter(f) {
      filter = f;
      buildFilters();
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').textContent = dark ? '☀️ 라이트' : '🌙 다크';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    /* ── Drag & drop reorder (operates on master todos array) ── */
    function onDragStart(e, id) {
      dragId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.currentTarget.classList.add('dragging');
    }
    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      dragId = null;
    }
    function onDragOver(e, id) {
      e.preventDefault();
      if (id !== dragId) e.currentTarget.classList.add('drag-over');
    }
    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function onDrop(e, targetId) {
      e.preventDefault();
      if (dragId === null || dragId === targetId) return;
      const from = todos.findIndex(t => t.id === dragId);
      const to = todos.findIndex(t => t.id === targetId);
      if (from < 0 || to < 0) return;
      const [moved] = todos.splice(from, 1);
      todos.splice(to, 0, moved);
      saveTodos(); render();
    }

    function render() {
      const list = document.getElementById('todoList');
      const visible = todos.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done') return t.done;
        if (filter.startsWith('cat:')) return t.category === filter.slice(4);
        return true;
      });

      const total = todos.length;
      const doneCount = todos.filter(t => t.done).length;
      document.getElementById('statsText').textContent =
        `전체 ${total}개 · 완료 ${doneCount}개 · 남음 ${total - doneCount}개`;
      document.getElementById('progressBar').style.width =
        total ? `${Math.round(doneCount / total * 100)}%` : '0%';

      if (visible.length === 0) {
        list.innerHTML = '<div class="empty-state">할 일이 없습니다.</div>';
        return;
      }

      list.innerHTML = visible.map(t => {
        if (t._editing) {
          return `<div class="todo-card">
            <span class="drag-handle">⠿</span>
            <div class="check-wrap"><input type="checkbox" disabled /></div>
            <div class="todo-body">
              <input class="edit-input" data-edit="${t.id}" value="${escapeHtml(t.text)}"
                onblur="commitEdit(${t.id}, this.value)"
                onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escapeHtml(t.text)}';this.blur();}" />
            </div>
          </div>`;
        }
        return `<div class="todo-card ${t.done ? 'done' : ''}" draggable="true"
          ondragstart="onDragStart(event, ${t.id})"
          ondragend="onDragEnd(event)"
          ondragover="onDragOver(event, ${t.id})"
          ondragleave="onDragLeave(event)"
          ondrop="onDrop(event, ${t.id})">
          <span class="drag-handle" title="끌어서 이동">⠿</span>
          <div class="check-wrap">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})" />
          </div>
          <div class="todo-body">
            <div class="todo-text" ondblclick="startEdit(${t.id})">${escapeHtml(t.text)}</div>
            <div class="todo-meta">
              <span class="badge cat">${escapeHtml(t.category || '')}</span>
              <span class="badge ${t.priority}">${PRIO_LABEL[t.priority]}</span>
              <span class="todo-date">${t.created || ''}</span>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteTodo(${t.id})" title="삭제">✕</button>
        </div>`;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('todoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    document.getElementById('todayDate').textContent =
      new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    if (localStorage.getItem('theme') === 'dark') toggleTheme();
    buildFilters();
    render();
  </script>
</body>
</html>
